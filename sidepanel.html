<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body {
        background: #f6f6ef;
        display: flex;
        flex-direction: column;
      }
      #frame-container {
        flex: 1;
        position: relative;
        overflow: hidden;
      }
      #frame-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
      }
      #frame-container iframe.behind {
        z-index: 0;
      }
      #frame-container iframe.front {
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="frame-container">
      <iframe id="hn-frame-a" class="front"></iframe>
      <iframe id="hn-frame-b" class="behind"></iframe>
    </div>
    <script src="browser-polyfill.min.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
